name: Deploy NonProd

on:
  push:
    branches:
      - staging

  # Allows you to run this workflow manually from the Actions tab
  on:
    workflow_dispatch:
      inputs:
        environment:
          description: 'Choose the environment'
          default: 'beta'
          required: true
          type: choice
          options:
            - beta
            - dark
            - green

# Allow only one concurrent deployment
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy 💥
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_S3_BUCKET_NAME: "${{ vars.AWS_S3_BUCKET_NAME }}"
      VITE_STAGE: "${{ vars.VITE_STAGE }}"

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup node 🚩
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v4

      - name:
        run: echo "🚀 Built s3://${{ github.event.inputs.environment }}.${{ env.AWS_S3_BUCKET_NAME }}"
