name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup ⚡
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'

      - name: Install 📚
        run: yarn
        env:
          HUSKY: 0

      - name: Build 📚
        run: yarn build
        env:
          HUSKY: 0

      - name: Semantic Release 💥
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
