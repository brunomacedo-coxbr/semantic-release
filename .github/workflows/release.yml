name: Release

on:
  push:
    branches:
      - release/*

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_STAGE: "${{ vars.VITE_STAGE }}"

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup 🚩
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v4

      - name: Install 🎒
        run: pnpm install --prefer-offline --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build 📚
        run: pnpm build
        env:
          HUSKY: 0

      - name: Semantic Release 💥
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Changes 🔍
        id: Check_Changes
        run: |
          git fetch origin $GITHUB_REF
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Changes detected!"
            echo "::set-output name=changed::true"
          else
            echo "No changes detected."
            echo "::set-output name=changed::false"
          fi
        continue-on-error: true

      - name: Create PR from release to main 🚀
        if: success() && steps.Check_Changes.outcome == 'success' && steps.Check_Changes.outputs.changed == 'true'
        run: |
          git fetch origin $GITHUB_REF
          git checkout $GITHUB_REF
          git add .
          git commit -m "chore: update after release"
          git push origin $GITHUB_REF
          gh pr create --base main --head $GITHUB_REF --title "Release PR" --body "Automated PR with release updates." --label "release"

      - name: Create PR from release to staging 🚀
        if: success() && steps.Check_Changes.outcome == 'success' && steps.Check_Changes.outputs.changed == 'true'
        run: |
          git fetch origin $GITHUB_REF
          git checkout $GITHUB_REF
          git add .
          git commit -m "chore: update after release"
          git push origin $GITHUB_REF
          gh pr create --base staging --head $GITHUB_REF --title "Release PR" --body "Automated PR with release updates." --label "release"
