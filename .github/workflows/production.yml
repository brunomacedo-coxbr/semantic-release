name: Deploy Production

on:
  push:
    branches:
      - release/*

permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  deploy-dark:
    name: Deploy to Dark Prod 💥
    runs-on: ubuntu-latest
    environment: dark-prod
    env:
      VITE_STAGE: "${{ vars.VITE_STAGE }}"
    outputs:
      build-id: ${{ steps.generate-id.outputs.build-id }}
      artifact-id: ${{ steps.upload-build.outputs.artifact-id }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup node 🚩
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v4

      - name: Install dependencies 🎒
        run: pnpm install --prefer-offline --frozen-lockfile
        env:
          HUSKY: 0

      - name: Generate build identifier �
        id: generate-id
        run: |
          # Create unique build identifier using timestamp and short commit hash
          BUILD_ID="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}"
          echo "Generated build ID: $BUILD_ID"
          echo "build-id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Build application 📚
        run: pnpm build
        env:
          HUSKY: 0

      - name: Create build archive 📦
        run: |
          cd packages/ui
          # Create build archive with build ID
          tar -czf "build-${{ steps.generate-id.outputs.build-id }}.tar.gz" dist/
          ls -la build-*.tar.gz

      - name: Upload build artifact 🚀
        id: upload-build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.generate-id.outputs.build-id }}
          path: packages/ui/build-${{ steps.generate-id.outputs.build-id }}.tar.gz
          retention-days: 90
          compression-level: 6

      - name: Deploy to Dark Prod 🚀
        run: |
          echo "🚀 Deploying build ${{ steps.get-version.outputs.version }} to dark-prod"
          echo "Artifact ID: ${{ steps.upload-build.outputs.artifact-id }}"
          # Add your actual deployment logic here

  deploy-green:
    name: Deploy to Green Prod 💥
    needs:
      - deploy-dark
    runs-on: ubuntu-latest
    environment: green-prod
    env:
      VITE_STAGE: "${{ vars.VITE_STAGE }}"

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact �
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.deploy-dark.outputs.build-id }}
          path: ./build-artifacts

      - name: Extract and prepare build �
        run: |
          cd build-artifacts
          # Extract the build archive
          tar -xzf build-${{ needs.deploy-dark.outputs.build-id }}.tar.gz

          # List contents for debugging
          ls -la

          # Verify extraction
          ls -la dist/

          # Copy to expected location for deployment
          mkdir -p ../packages/ui/dist
          cp -r dist/* ../packages/ui/dist/

          echo "✅ Build extracted and prepared for deployment"

      - name: Deploy to Green Prod 🚀
        run: |
          echo "🚀 Deploying build ${{ needs.deploy-dark.outputs.build-id }} to green-prod"
          echo "Using artifact from: ${{ needs.deploy-dark.outputs.artifact-id }}"
          # Add your actual deployment logic here

  release:
    name: Semantic Release 💥
    runs-on: ubuntu-latest
    environment: production
    needs:
      - deploy-dark
      - deploy-green
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      VITE_STAGE: "${{ vars.VITE_STAGE }}"

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup node 🚩
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v4

      - name: Install 🎒
        run: pnpm install --prefer-offline --frozen-lockfile
        env:
          HUSKY: 0

      - name: Download build artifact for release 📥
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.deploy-dark.outputs.build-id }}
          path: ./build-artifacts

      - name: Extract build for semantic-release 📦
        run: |
          cd build-artifacts
          # Extract build to packages/ui/dist for semantic-release
          tar -xzf build-${{ needs.deploy-dark.outputs.build-id }}.tar.gz

          # Copy to expected location
          mkdir -p ../packages/ui/dist
          cp -r dist/* ../packages/ui/dist/

          echo "✅ Build extracted for semantic-release"

      - name: Release 🚀
        id: semantic-release
        run: |
          echo "Running semantic-release..."
          npx semantic-release

          # Capture the released version from package.json after semantic-release
          RELEASED_VERSION=$(node -p "require('./package.json').version")
          echo "Released version: $RELEASED_VERSION"
          echo "released-version=$RELEASED_VERSION" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned build artifact 🎯
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.semantic-release.outputs.released-version }}
          path: packages/ui/dist/
          retention-days: 90
          compression-level: 9

      - name: Create PR from release to main 🚀
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: ${{ github.ref_name }}
          title: "Sync release branch to main"
          body: "Automated PR to sync release changes into main."
          labels: "semantic-release"
          commit-message: "chore(sync): release → main"

      - name: Create PR from release to staging 🚀
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: staging
          branch: ${{ github.ref_name }}
          title: "Sync release branch to staging"
          body: "Automated PR to sync release changes into staging."
          labels: "semantic-release"
          commit-message: "chore(sync): release → staging"
