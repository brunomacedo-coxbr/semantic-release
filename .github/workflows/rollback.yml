name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Rollback version (Tag)"
        required: true
        type: string

jobs:
  deploy-dark:
    name: Rollback Dark Prod
    runs-on: ubuntu-latest
    environment: dark-prod
    steps:
      - name: Checkout Repository 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download rollback artifact 📥
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          name: rollback-${{ github.event.inputs.version }}
          path: ./rollback-files
          workflow_search: true
          search_artifacts: true
          if_no_artifact_found: fail

      - name: Prepare rollback files 🎒
        run: |
          VERSION=${{ github.event.inputs.version }}
          echo "Rolling back to version $VERSION"

          # Create dist directory if it doesn't exist
          mkdir -p packages/ui/dist

          # Copy rollback files to dist directory
          if [ -d "./rollback-files" ] && [ "$(ls -A ./rollback-files)" ]; then
            echo "Found rollback files for version $VERSION"
            cp -r ./rollback-files/* ./packages/ui/dist/
            echo "✅ Rollback files copied successfully"

            # Verify files were copied
            echo "Contents of packages/ui/dist/:"
            ls -la packages/ui/dist/
          else
            echo "❌ No rollback files found for version $VERSION!"
            exit 1
          fi

      - name: Deploy the Rollback Version 🚀
        run: |
          echo "Deploying version $VERSION to dark-prod"
          # Insert your deployment logic here, for example:
          # ./deploy.sh or whatever process is needed to deploy the files

  deploy-green:
    name: Rollback Green Prod
    needs:
      - deploy-dark
    runs-on: ubuntu-latest
    environment: green-prod
    steps:
      - name: Checkout Repository 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download rollback artifact 📥
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          name: rollback-${{ github.event.inputs.version }}
          path: ./rollback-files
          workflow_search: true
          search_artifacts: true
          if_no_artifact_found: fail

      - name: Prepare rollback files 🎒
        run: |
          VERSION=${{ github.event.inputs.version }}
          echo "Rolling back to version $VERSION"

          # Create dist directory if it doesn't exist
          mkdir -p packages/ui/dist

          # Copy rollback files to dist directory
          if [ -d "./rollback-files" ] && [ "$(ls -A ./rollback-files)" ]; then
            echo "Found rollback files for version $VERSION"
            cp -r ./rollback-files/* ./packages/ui/dist/
            echo "✅ Rollback files copied successfully"

            # Verify files were copied
            echo "Contents of packages/ui/dist/:"
            ls -la packages/ui/dist/
          else
            echo "❌ No rollback files found for version $VERSION!"
            exit 1
          fi

      - name: Deploy the Rollback Version 🚀
        run: |
          echo "Deploying version $VERSION to green-prod"
          # Insert your deployment logic here, for example:
          # ./deploy.sh or whatever process is needed to deploy the files
