<script>
  function copyToClipboard(text, event) {
    navigator.clipboard.writeText(text);

    const el = event.currentTarget;

    el.classList.add("copied");
    setTimeout(() => {
      el.classList.remove("copied");
    }, 1500);
  }
</script>
